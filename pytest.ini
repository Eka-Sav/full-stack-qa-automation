[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -p no:anyio
    --strict-markers
    --alluredir=allure-results
    --clean-alluredir
    --screenshot=only-on-failure
    -v
    --tb=short

markers =
    smoke: Quick sanity checks, run before the full suite
    api: API tests (require a running backend)
    ui: UI tests (require a running frontend)
    db: Direct database assertion tests
    negative: Negative and edge-case scenarios
    slow: Slow tests
    integration: End-to-end tests without UI (API + DB)
    e2e: End-to-end tests through the UI (UI + API + DB)
    ai_generated: Tests generated by the AI pipeline