name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - run: ruff check .

  api-tests:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/finance
      BASE_URL: http://localhost:8005
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: Eka-Sav/full-stack-qa-app
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            app/requirements.txt
      - run: pip install -r requirements.txt -r app/requirements.txt
      - name: Start backend
        working-directory: app
        run: nohup python -m uvicorn backend.main:app --host 0.0.0.0 --port 8005 > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
      - name: Wait for backend
        run: curl -sf --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8005/docs || (cat backend.log && exit 1)
      - name: Run tests
        run: pytest -m "api or db or integration" --alluredir=allure-results
      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-api
          path: allure-results
      - name: Upload debug logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: debug-api
          path: backend.log